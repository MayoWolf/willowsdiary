<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fef3d3">
  <meta name="description" content="Willow’s Diary is an eveningwear label focused on party minis in black lace, animal print and sequins. Sizes XS–L.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Willow’s Diary">
  <meta property="og:title" content="Willow’s Diary | Dresses for going out">
  <meta property="og:description" content="Party minis in black lace, animal print and sequins. Sizes XS–L.">
  <meta property="og:image" content="https://raw.githubusercontent.com/MayoWolf/willowsdiary/main/public/assets/willows-diary-social.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Willow’s Diary wordmark in brown on ivory">
  <meta name="twitter:card" content="summary_large_image">
  <title>Willow’s Diary | Dresses for going out</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header frame">
    <a class="wordmark" href="#top" aria-label="Willow’s Diary home">
      <img src="assets/willows-diary-logo.webp" width="480" height="255" alt="Willow’s Diary">
    </a>
    <nav aria-label="Main navigation">
      <a class="text-link" href="#dresses">The dresses <span aria-hidden="true">↓</span></a>
    </nav>
  </header>

  <main id="main" class="frame" tabindex="-1">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-intro">
        <h1 id="hero-title">Dresses for <span>going out.</span></h1>
        <div class="hero-copy">
          <p>Party minis for birthday dinners, celebrations and nights out.</p>
          <a class="text-link" href="#dresses">Explore the collection <span aria-hidden="true">↘</span></a>
        </div>
      </div>

      <figure class="editorial">
        <div class="editorial-photos">
          <img class="editorial-curtain" src="assets/velvet-curtain.webp"
            srcset="assets/velvet-curtain-small.webp 720w, assets/velvet-curtain.webp 1440w"
            sizes="(max-width: 860px) 66vw, (max-width: 1440px) 64vw, 900px"
            width="1440" height="961" alt="Parted red velvet curtains" fetchpriority="high">
          <img class="editorial-sequins" src="assets/sequin-detail.webp" width="640" height="800"
            alt="Close-up of gold sequin fabric" decoding="async">
        </div>
        <figcaption>Collection inspiration</figcaption>
      </figure>
    </section>

    <section class="collection" id="dresses" aria-labelledby="collection-title">
      <div>
        <h2 id="collection-title">The dresses</h2>
        <p>Mini hems and a little peekaboo detail.</p>
      </div>
      <dl class="collection-details">
        <div>
          <dt>Details</dt>
          <dd>Black lace, animal print and sequins</dd>
        </div>
        <div>
          <dt>Sizes</dt>
          <dd>XS, S, M, L</dd>
        </div>
      </dl>
    </section>
  </main>

  <footer class="frame site-footer">
    <p>To create memories</p>
    <a class="text-link" href="#top">Back to top <span aria-hidden="true">↑</span></a>
  </footer>
</body>
</html>
